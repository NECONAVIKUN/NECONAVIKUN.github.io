<!DOCTYPE html>
<html lang="ja" xml:lang="ja" dir="ltr" prefix="og: https://ogp.me/ns#">
  <head>
    {% include head.html %}
    <meta name="description" content="私、ねこナビくんのホームページです。">
    <title>ねこナビくんのホームページ</title>
    <link rel="canonical" href="https://neconavikun.github.io/base/">
  </head>
  <body>
    <header id="top">
      <h1 class="title">ねこナビくんホームページ</h1>
      <div role="button" class="nav_text" id="text" tabindex="0">
        <p aria-hidden="true">＿人人人人人人人人人人人人人＿</p>
        <p><span aria-hidden="true">＞　</span>ゆっくり見ていってね<span aria-hidden="true">☆　＜</span></p>
        <p aria-hidden="true">￣ＹＹＹＹＹＹＹＹＹＹＹＹＹ￣</p>
      </div>
      <span class="picture">
        <img role="button" src="/marisa-migi.webp" alt="魔理沙" width="256" height="144" id="marisa" class="nav_s" tabindex="0">
        <img role="button" src="/reimu-hidari.webp" alt="霊夢" width="256" height="144" id="reimu" class="nav_s" tabindex="0">
      </span>
      <audio id="reimu_s" src="/reimu.mp3"></audio>
      <audio id="marisa_s" src="/marisa.mp3"></audio>
      <audio id="text_s" src="/text_s.mp3"></audio>
    </header>
    <hr>
    <main id="main">
      <section>
        <h2 class="title u_title">乱数式メロディーメーカー</h2>
        <p>音符数：<input type="number" id="note_count" value="20" min="1" max="100"></p>
        <button id="btn_gen">乱数生成</button>
        <button id="btn_play" disabled>再生</button>
        <button id="btn_export" disabled>WAV保存</button>
      </section>
      <script type="module" src="rm_main.mjs"></script>
      <script src="/main.js" defer></script>
    </main>
    <hr>
{% include footer.html %}
  </body>
</html>
